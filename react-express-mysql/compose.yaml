services:

  backend:
    build:
      context: ./backend
      target: development
      args:
        NODE_ENV: development

    command: npm run start-watch

    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_DB: example
      DATABASE_USER: root
      DATABASE_PASSWORD: /run/secrets/db-password
      NODE_ENV: development

    ports:
      - "8080:80"

    secrets:
      - db-password

    depends_on:
      - db


  db:
    image: mysql:8.0.27

    command: "--default-authentication-plugin=mysql_native_password"

    environment:
      MYSQL_DATABASE: example
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db-password

    volumes:
      - db-data:/var/lib/mysql

    secrets:
      - db-password


  frontend:
    build:
      context: ./frontend
      target: development

    ports:
      - "3000:3000"

    depends_on:
      - backend


volumes:
  db-data:


secrets:
  db-password:
    file: ./db/password.txt